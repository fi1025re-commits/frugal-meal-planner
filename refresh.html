<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>最新版に更新中｜食費節約レシピ</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#fffaf4;color:#403a34;min-height:100vh;display:grid;place-items:center}
    .card{width:min(88vw,420px);background:#fff;border:1px solid #ece4da;border-radius:24px;padding:28px;text-align:center;box-shadow:0 10px 30px rgba(82,67,51,.08)}
    .spin{width:42px;height:42px;border:4px solid #e7e0d8;border-top-color:#6f8d68;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    h1{font-size:20px;margin:0 0 8px}
    p{font-size:13px;line-height:1.7;color:#766e65;margin:0}
  </style>
</head>
<body>
  <main class="card">
    <div class="spin"></div>
    <h1>最新版に更新しています</h1>
    <p>古い画面キャッシュを削除してから、自動でトップページを開きます。</p>
  </main>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister()));
        }
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(
            names
              .filter(name => name.startsWith('setsuyaku-recipe-'))
              .map(name => caches.delete(name))
          );
        }
      } catch (e) {
        console.warn('cache reset warning', e);
      } finally {
        const bust = Date.now();
        location.replace('./index.html?fresh=' + bust);
      }
    })();
  </script>
</body>
</html>
